site_name: llm-wiki
site_description: A self-healing local-LLM wiki that compounds documents across working, episodic, semantic, and procedural memory tiers.
site_url: https://krishddd.github.io/llm-wiki/
repo_url: https://github.com/krishddd/llm-wiki
repo_name: krishddd/llm-wiki
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - Schema (CLAUDE.md): CLAUDE.md
  - Agent catalogue (AGENTS.md): AGENTS.md
  - Design:
      - Multimodal graph: design/multimodal-graph.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
