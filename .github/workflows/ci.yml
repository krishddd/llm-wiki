name: ci
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a flurry of pushes doesn't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; \
          elif [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff mypy pytest pytest-cov pytest-asyncio
      - name: Ruff
        run: ruff check llm_wiki tests
      - name: Mypy (non-blocking)
        continue-on-error: true
        run: mypy llm_wiki || true
      - name: Unit tests — deterministic features (blocking)
        # No Ollama/network needed; these gate the adaptive-pipeline features.
        env:
          OLLAMA_HOST: http://mock
        run: |
          pytest -q \
            tests/test_domain_routing.py \
            tests/test_privacy.py \
            tests/test_dense_router.py \
            tests/test_agentic_ingest.py \
            tests/test_media_graph.py \
            tests/test_providers.py
      - name: Unit tests — full suite (Ollama mocked, non-blocking)
        continue-on-error: true
        env:
          OLLAMA_HOST: http://mock
        run: pytest -q -m "not integration" || true
      - name: Docker build (non-blocking)
        continue-on-error: true
        run: |
          if [ -f Dockerfile ]; then docker build -t llm-wiki-poc:ci . || true; \
          else echo "No Dockerfile — skipping"; fi
