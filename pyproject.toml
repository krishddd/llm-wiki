[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-compounding-wiki"
version = "0.1.1"
description = "A self-healing local-LLM wiki that compounds your documents across working, episodic, semantic, and procedural memory tiers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "krishddd" }]
keywords = ["rag", "llm", "ollama", "knowledge-base", "wiki", "vector-search", "okf", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
    "Typing :: Typed",
]

# Core runtime — the FastAPI app + full ingest/query pipeline.
# Kept in sync with requirements.txt (core block).
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
    "PyYAML>=6.0.2",
    "numpy>=1.26.4,<2.0",
    "rank-bm25>=0.2.2",
    "chromadb>=0.5.15",
    "flashrank>=0.2.9",
    "networkx>=3.3",
    "thefuzz>=0.22.1",
    "python-Levenshtein>=0.25.1",
    "pypdf>=5.0.1",
    "pdfplumber>=0.11.4",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "beautifulsoup4>=4.12.3",
    "APScheduler>=3.10",
]

[project.optional-dependencies]
# OCR of scanned PDFs (INGEST_OCR=true) — also needs the Tesseract + Poppler system binaries.
ocr = ["pytesseract>=0.3.13", "pdf2image>=1.17.0", "Pillow>=10.4.0"]
# Agent-facing MCP server (`llm-wiki mcp`).
mcp = ["mcp>=1.0.0"]
# Documentation site (MkDocs Material — GitHub Pages).
docs = ["mkdocs-material>=9.5", "pymdown-extensions>=10.7"]
# Dev / test tooling.
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "respx>=0.21.1",
    "types-PyYAML>=6.0.12",
    "build>=1.2",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/krishddd/llm-wiki"
Documentation = "https://krishddd.github.io/llm-wiki/"
Repository = "https://github.com/krishddd/llm-wiki"
Issues = "https://github.com/krishddd/llm-wiki/issues"
Changelog = "https://github.com/krishddd/llm-wiki/blob/main/CHANGELOG.md"

[project.scripts]
llm-wiki = "llm_wiki.cli:main"

[tool.setuptools.packages.find]
include = ["llm_wiki*"]
exclude = ["tests*", "scripts*", "eval*"]

[tool.setuptools.package-data]
llm_wiki = ["static/*.html", "static/**/*", "py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # line too long — formatter handles
    "E402",   # module-level import not at top — common after env-var setup
    "E741",   # ambiguous variable name (l, I, O)
    "E702",   # multi-statement line — intentional in compact data tables
    "B008",   # function call in default arg (common pattern with FastAPI Depends)
    "B023",   # function does not bind loop var (false-positive prone)
    "SIM102", # collapsible nested if — readability often wins
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["F401", "F811", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that require a live Ollama instance",
]
